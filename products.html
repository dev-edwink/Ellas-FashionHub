    <section class="max-w-6xl mx-auto px-4 sm:px-6">
      <h1
        class="font-bold text-3xl sm:text-[32px] text-center tracking-wide text-slate-900 mt-10 mb-6"
      >
        ALL PRODUCTS
      </h1>

      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-slate-200 pb-4 mb-8"
      >
        <p class="text-sm text-slate-500">Browse our full collection</p>

        <div class="flex items-center gap-3">
          <label for="categoriesList" class="text-sm font-medium">
            Categories
          </label>

          <select
            name="categories"
            id="categoriesList"
            class="w-full sm:w-56 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm"
          >
            <option value="all">All categories</option>

        </div>

    <div
      id="allProducts"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 px-20"
    ></div>

    <div
      id="selectedCategory"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 px-20"
    ></div>

    <script>
      const prodPage = document.getElementById("allProducts");
      const categoriesList = document.getElementById("categoriesList");
      const selectedCategory = document.getElementById("selectedCategory");
      const category = document.getElementById("category");
      const cartButton = document.getElementById("cartButton");
      const productId = document.querySelector(["data-index"]);

      categoriesList.addEventListener("change", getCategory);

      async function getCategory() {
        try {
          let inputCategory = categoriesList.value;
          console.log(inputCategory);

          await fetch(
            `https://dummyjson.com/products/category/${inputCategory}`,
          )
            .then((response) => {
              if (!response.ok) {
                throw new Error("Bad Response");
              }
              return response.json();
            })
            .then((data) => {
              let products = data.products;
              prodPage.hidden = true;

              selectedCategory.innerHTML = "";
              products.forEach((product) => {
                let newDiv = document.createElement("div");

                newDiv.innerHTML = `<div
                                      class="bg-white border border-slate-200 max-h-[630px]  flex flex-col justify-between shadow-sm w-full max-w-sm rounded-lg mx-auto mt-6 overflow-hidden">
                                      <div class="px-4 py-3 flex justify-between gap-4 flex-wrap sm:px-6">
                                          <h3 class="text-slate-900 text-base font-semibold">${product.title}</h3>
                                      </div>

                                      <div class="aspect-[3/2] w-full bg-gray-50">
                                          <img src="${product.thumbnail}" class="w-full h-fit object-cover" alt="Card image" />
                                      </div>

                                      <div class="p-4 sm:p-6">
                                          <p class="text-sm text-slate-600 leading-relaxed">${product.description}</p>

                                          <div class="mt-6 flex justify-between items-center gap-4">
                                            <span class="text-lg text-slate-900 font-bold">$${product.price}</span>
                                            <button id="cartButton"
                                            data-index
                                            class="inline-block py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                                            Add to Cart
                                        </button>
                                          </div>
                                      </div>
                                    </div>`;
                selectedCategory.append(newDiv);
              });
            });
        } catch (error) {
          console.error(error.message);
        }
      }

      async function getCategories() {
        try {
          await fetch("https://dummyjson.com/products/category-list")
            .then((response) => response.json())
            .then((data) => {
              console.log(data);

              data.forEach((category) => {
                let list = document.createElement("option");

                list.innerHTML = `
                            <option id="${category}" value="${category}">${category}</option>
                            `;
                categoriesList.append(list);
              });
            });
        } catch (error) {
          console.error(error.message);
        }
      }

      async function getAllProducts() {
        try {
          const response = await fetch("https://dummyjson.com/products");
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || "Failed to fetch all products");
          }
          console.log(result.message);
          let products = result.products;

          products.forEach((product) => {
            let newDiv = document.createElement("div");
            newDiv.style.border = "2px";
            newDiv.style.borderColor = "#000000";

            newDiv.innerHTML = `<div
                                  class="bg-white border border-slate-200 max-h-[630px]  flex flex-col justify-between shadow-sm w-full max-w-sm rounded-lg mx-auto mt-6 overflow-hidden">
                                  <div class="px-4 py-3 flex justify-between gap-4 flex-wrap sm:px-6">
                                      <h3 class="text-slate-900 text-base font-semibold">${product.title}</h3>
                                  </div>

                                  <div class="aspect-[3/2] w-full bg-gray-50">
                                      <img src="${product.thumbnail}" class="w-full h-fit object-cover" alt="Card image" />
                                  </div>

                                  <div class="p-4 sm:p-6">
                                      <p class="text-sm text-slate-600 leading-relaxed">${product.description}</p>

                                      <div class="mt-6 flex justify-between items-center gap-4">
                                        <span class="text-lg text-slate-900 font-bold">$${product.price}</span>
                                        <button id="cartButton"
                                        data-index
                                            class="inline-block py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                                            Add to Cart
                                        </button>
                                      </div>
                                  </div>
                                </div>`;
            prodPage.append(newDiv);
          });
        } catch (error) {
          console.error(error.message);
        }
      }
