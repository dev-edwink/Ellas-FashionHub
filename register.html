<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <main class="min-h-screen flex flex-col justify-center p-4 md:p-8 ">
   <div class="w-full max-w-lg mx-auto sm:max-w-4xl border-4 border-blue-400 p-20 rounded-xl">
      <div class="mb-12">
         <a href="index.html" class="text-4xl font-bold text-slate-900 leading-tight! lg:text-5xl underline underline-offset-8">GLAMM!
         </a>
         <p class="text-slate-600 text-base mt-6">Create your account and get started</p>
      </div>

      <form class="w-full">
         <div class="grid sm:grid-cols-2 gap-6">
            <div>
               <label for="fname" class="mb-2 text-slate-900 font-medium text-sm inline-block">First
                  Name</label>
               <input type="text" id="fname" name="fname" placeholder="John" required
                  class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
            </div>
            <div>
               <label for="lname" class="mb-2 text-slate-900 font-medium text-sm inline-block">Last
                  Name</label>
               <input type="text" id="lname" name="lname" placeholder="Doe" required
                  class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
            </div>
            <div>
               <label for="email"
                  class="mb-2 text-slate-900 font-medium text-sm inline-block">Email</label>
               <input type="email" id="email" name="email" placeholder="john@readymadeui.com" required
                  class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
            </div>
            <div>
               <label for="mobile"
                  class="mb-2 text-slate-900 font-medium text-sm inline-block">Mobile Number</label>
               <input type="tel" id="mobile" name="mobile" placeholder="123-456-7890" required
                  class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
            </div>
            <div>
               <label for="password"
                  class="mb-2 text-slate-900 font-medium text-sm inline-block">Password</label>
               <input type="password" id="password" name="password" placeholder="••••••••" required
                  class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
            </div>
            <div>
               <label for="cpassword"
                  class="mb-2 text-slate-900 font-medium text-sm inline-block">Confirm
                  Password</label>
               <input type="password" id="cpassword" name="cpassword" placeholder="••••••••" required
                  class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
            </div>
            <div class="flex items-start flex-wrap gap-2">
               <label class="flex items-center group has-[input:checked]:text-slate-900">
                  <input id="tmc" name="tmc" type="checkbox" required class="sr-only" />
                  <!-- Custom box -->
                  <span class="flex h-4 w-4 shrink-0 items-center justify-center rounded outline-1 outline-slate-300 bg-white group-has-[input:checked]:bg-blue-600 group-has-[input:checked]:outline-blue-600 group-focus-within:outline-2 group-focus-within:outline-blue-600" aria-hidden="true">
                     <!-- Checkmark -->
                     <svg class="size-3 text-white opacity-0 group-has-[input:checked]:opacity-100" viewBox="0 0 12 10"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 5l3 3 7-7" />
                     </svg>
                  </span>
                  <span class="ml-3 text-sm text-slate-700">
                     I accept the
                  </span>
               </label>

               <a href="#"
                  class="ml-1 text-sm font-medium text-blue-700 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">
                  Terms and Conditions
               </a>
            </div>
         </div>

         <div class="mt-6">
            <button type="submit"
               class="py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
               Create an account</button>
         </div>
      </form>
   </div>
</main>
</body>
</html>
